research_task:
  description: >
    Research the most important recent news and developments about {topic}
    using the web_search tool. Focus on information relevant to the current
    year, {current_year}. Run multiple targeted searches if needed to cover
    different angles and confirm key developments. Identify concrete examples
    and capture source details for every finding so it can be cited.
  expected_output: >
    A cited research brief with five to six findings covering the most relevant
    news and developments about {topic}. For each finding include: a short
    title, 1-2 sentence summary, why it matters, a concrete example when
    available, source/publisher, publication date when available, and the
    source URL. List only findings supported by web search results and include
    the URLs needed for citations.
  agent: researcher

reporting_task:
  description: >
    Synthesize the cited research about {topic} into a concise, easy-to-scan
    news briefing. Start with a short overview before presenting any key points.
    Follow it with a pictorial Mermaid diagram, five or six key-point bullets,
    a separate examples section, a brief overall summary, and a sources
    section. Ground claims in the research findings and their URLs; do not
    invent sources, dates, or unsupported details. Do not expand the briefing
    into a long-form report.
  expected_output: |
    Return Markdown with exactly these sections in this order:
    ## Overview
    Start with a short, plain-language introduction to {topic} and why it matters. Do not start with bullets.

    ## Pictorial representation
    Include a valid Mermaid flowchart in a ```mermaid code block. Use `flowchart TD`, simple alphanumeric node IDs, and double-quoted labels for every node (for example, A["Large Language Models (LLMs)"]). Put each node or edge on its own line and do not use semicolons. Keep the diagram to three to six nodes with accurate, concise labels.

    ## Key points
    Include five or six concise bullets covering the most important recent developments. When possible, attribute key claims inline with a short source name in parentheses.

    ## Examples
    Give concrete examples that illustrate the topic or key points, grounded in the cited research.

    ## Summary
    End with a brief paragraph summarizing the topic.

    ## Sources
    List the sources used as Markdown bullet links in the form `- [Title — Publisher, Date](URL)`. Include publisher and date when available; if a date is unavailable, omit it rather than guessing. Every major claim in the briefing should be traceable to a listed source.

    Do not wrap the entire report in a code block. Keep claims grounded in the research.
  agent: reporting_analyst
