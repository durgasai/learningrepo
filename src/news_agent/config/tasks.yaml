research_task:
  description: >
    Research the most important recent news and developments about {topic}
    using the web_search tool. Focus on information relevant to the current
    year, {current_year}. Run multiple targeted searches if needed to cover
    different angles, compare sources, and confirm key developments. Prioritize
    high-quality, recent sources and capture evidence needed for citations and
    usefulness (impact, recency, and uncertainty).
  expected_output: >
    A cited research brief with five to six findings covering the most relevant
    news and developments about {topic}. For each finding include: a short
    title; 1-2 sentence summary of what happened; why it matters/impact; a
    concrete example or evidence detail when available; publication date or
    recency/timeframe when available; source/publisher; source URL; and a brief
    confidence note or limitation if information is uncertain, conflicting, or
    not recently dated. Also include 1-3 notable risks, open questions, or
    things to watch that are supported by the sources. List only findings
    supported by web search results and include the URLs needed for citations.
  agent: researcher

reporting_task:
  description: >
    Synthesize the cited research about {topic} into a concise, easy-to-scan,
    decision-useful news briefing. Start with a short overview before presenting
    any key points. Follow it with a pictorial Mermaid diagram, five or six
    key-point bullets, a separate examples section, risks/open questions, a
    brief overall summary, and a sources section. Ground claims in the research
    findings and their URLs; state recency or uncertainty when relevant; do not
    invent sources, dates, or unsupported details. Keep the briefing focused and
    scannable.
  expected_output: |
    Return Markdown with exactly these sections in this order:
    ## Overview
    Start with a short, plain-language introduction to {topic}, why it matters now, and the relevant timeframe ({current_year}/recent). Do not start with bullets.

    ## Pictorial representation
    Include a valid Mermaid flowchart in a ```mermaid code block. Use `flowchart TD`, simple alphanumeric node IDs, and double-quoted labels for every node (for example, A["Large Language Models (LLMs)"]). Put each node or edge on its own line and do not use semicolons. Keep the diagram to three to six nodes with accurate, concise labels that reflect the main developments or relationships.

    ## Key points
    Include five or six concise bullets covering the most important recent developments. For each bullet, include: **what happened**, **why it matters/impact**, and an inline source attribution in parentheses (publisher or short source name; include date/timeframe when available). Prefer specific, recent, cited facts over vague claims.

    ## Examples
    Give concrete examples that illustrate the topic or key points, grounded in the cited research. Tie each example to a source attribution in parentheses when possible.

    ## Risks and open questions
    Include 2-4 concise bullets on limitations, uncertainties, disagreements across sources, or things to watch next. Ground these in the research and note when evidence is limited.

    ## Summary
    End with a brief paragraph summarizing the main takeaway, overall significance, and confidence/recency caveat if appropriate.

    ## Sources
    List the sources used as Markdown bullet links in the form `- [Title — Publisher, Date](URL)`. Include publisher and date/timeframe when available; if unavailable, omit it rather than guessing. Every major claim in the briefing should be traceable to a listed source.

    Do not wrap the entire report in a code block. Keep claims grounded in the research.
  agent: reporting_analyst
